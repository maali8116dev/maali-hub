# Serves the Vite SPA build. TLS is terminated by Coolify's proxy (Traefik).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- Security headers ---
    # NOTE: nginx add_header inheritance — any location that declares its own
    # add_header loses these, so the cache locations below repeat them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP starts in Report-Only mode: watch the browser console on staging,
    # then rename to Content-Security-Policy to enforce.
    # Replace api.maalihub.com with the actual Supabase domain if different.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://js.stripe.com https://js.paystack.co https://*.posthog.com; style-src 'self' 'unsafe-inline'; font-src 'self' data: https://cdn.gpteng.co; img-src 'self' data: blob: https:; connect-src 'self' https://api.maalihub.com wss://api.maalihub.com https://api.stripe.com https://api.paystack.co https://checkout.paystack.com https://*.posthog.com https://*.sentry.io; frame-src https://js.stripe.com https://hooks.stripe.com https://checkout.paystack.com; worker-src 'self' blob:; frame-ancestors 'none'" always;

    # Hashed build assets: immutable, cache for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # index.html must never be cached (it references the hashed assets)
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # SPA fallback: unknown routes serve index.html (history API routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
