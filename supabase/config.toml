# Local OAuth: Studio Auth → Providers page does not load locally; configure here instead.
# Add to .env.supabase (copy from .env.supabase.example; gitignored):
#   SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID=<from Google Cloud>
#   SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET=<from Google Cloud>
# Google Cloud → Authorized redirect URI: http://127.0.0.1:54321/auth/v1/callback
# Then: npm run supabase:stop && npm run supabase:start
[auth]
enabled = true
site_url = "http://127.0.0.1:8080"
additional_redirect_urls = [
  "http://localhost:8080",
  "http://127.0.0.1:8080",
  "http://localhost:8080/auth/callback",
  "http://127.0.0.1:8080/auth/callback",
]

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET)"
skip_nonce_check = true

[analytics]
enabled = false

